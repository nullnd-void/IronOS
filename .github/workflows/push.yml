name: CI

# TS101-only build of v2.24-rc1 + OLED page-addressing fix.
# Runs on every push, or manually from the Actions tab ("Run workflow").
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache gcc-arm-none-eabi g++-arm-none-eabi newlib-arm-none-eabi findutils python3 py3-pip make git bash

      - name: Install dependencies (python)
        run: python3 -m pip install --break-system-packages bdflib pyyaml

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Git ownership exception
        run: git config --global --add safe.directory '*'

      - name: Apply usb-pd CC line fix
        run: git -C source/Core/Drivers/usb-pd apply "$GITHUB_WORKSPACE/patches/usbpd-cc-line-fix.patch" && git -C source/Core/Drivers/usb-pd diff --stat

      - name: Build TS101 (English)
        run: cd source && ./build.sh -l EN -m TS101

      - name: Archive TS101 firmware
        uses: actions/upload-artifact@v7
        with:
          name: TS101_EN-screenfix
          path: |
            source/Hexfile/TS101_*.hex
            source/Hexfile/TS101_*.dfu
          if-no-files-found: error
